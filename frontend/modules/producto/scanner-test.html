<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>
        Prueba Scanner
    </title>

</head>

<body>

    <h1>
        Prueba Scanner
    </h1>

    <button id="btn-escanear">
        📷 Escanear código
    </button>

    <h2>
        Resultado
    </h2>

    <pre id="resultado">
Sin código.
    </pre>

    <script type="module">

        import {
            Scanner
        } from "./scanner.js";

        const boton =
            document.getElementById(
                "btn-escanear",
            );

        const resultado =
            document.getElementById(
                "resultado",
            );

        boton.addEventListener(
            "click",
            async () => {

                boton.disabled = true;

                resultado.textContent =
                    "Buscando código...";

                try {

                    const scanner =
                        new Scanner();

                    const codigo =
                        await scanner.escanear();

                    resultado.textContent =
                        "Código detectado:\n\n" +
                        codigo;

                }

                catch (error) {

                    console.error(
                        error,
                    );

                    resultado.textContent =
                        "Error al escanear:\n\n" +
                        error.message;

                }

                finally {

                    boton.disabled = false;

                }

            },
        );

    </script>

</body>

</html>
