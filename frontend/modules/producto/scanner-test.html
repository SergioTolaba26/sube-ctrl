<!doctype html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Prueba Scanner
    </title>

</head>


<body>

    <h1>
        Prueba Scanner
    </h1>


    <button id="btn-escanear">
        📷 Escanear código
    </button>


    <h2>
        Resultado
    </h2>


    <pre id="resultado">
Sin código.
    </pre>


    <script type="module">

        import {
            Scanner
        } from "./scanner.js";


        const boton =
            document.getElementById(
                "btn-escanear",
            );


        const resultado =
            document.getElementById(
                "resultado",
            );


        boton.addEventListener(

            "click",

            async () => {

                boton.disabled =
                    true;


                resultado.textContent =
                    "Buscando código...";


                const scanner =
                    new Scanner();


                try {

                    await scanner.escanear(

                        (
                            codigo,
                        ) => {

                            console.log(
                                "HTML RECIBIÓ:",
                                codigo,
                            );


                            resultado.textContent =
                                "Código detectado:\n\n" +
                                codigo;


                            alert(
                                "HTML recibió: " +
                                codigo,
                            );


                            boton.disabled =
                                false;

                        },

                    );

                }
                catch (
                    error
                ) {

                    console.error(
                        "HTML ERROR:",
                        error,
                    );


                    resultado.textContent =
                        "Error al escanear.";


                    boton.disabled =
                        false;

                }

            },

        );

    </script>

</body>

</html>
