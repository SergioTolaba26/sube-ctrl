<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Prueba Scanner</title>
</head>
<body>

    <h1>Prueba Scanner</h1>

    <button id="btn-escanear">
        Escanear
    </button>

    <pre id="resultado"></pre>

    <script type="module">

        import { Scanner } from "./scanner.js";

        const boton =
            document.getElementById(
                "btn-escanear",
            );

        const resultado =
            document.getElementById(
                "resultado",
            );

        boton.addEventListener(
            "click",
            async () => {

                try {

                    const scanner =
                        new Scanner();

                    const codigo =
                        await scanner.escanear();

                    resultado.textContent =
                        codigo;

                }

                catch (error) {

                    console.error(
                        error,
                    );

                    resultado.textContent =
                        error.message;

                }

            },
        );

    </script>

</body>
</html>
